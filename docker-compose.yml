  abnormal_movement:
    container_name: abnormal_movement
    build: 
      context: .
      dockerfile: DTsolution/DTservices/abnormal_movement/Dockerfile
    volumes:
      - ./communication/connect.yml:/app/connect.yml:rw
    depends_on:
      - mockup
  stuck_joint:
    container_name: stuck_joint
    build: 
      context: .
      dockerfile: DTsolution/DTservices/stuck_joint_detection/Dockerfile
    volumes:
      - ./communication/connect.yml:/app/connect.yml:rw
    depends_on:
      - mockup
  rt_robot_prediction:
    container_name: robot_prediction
    build: 
      context: .
      dockerfile: DTsolution/DTservices/RT_robot_prediction/Dockerfile
    volumes:
      - ./communication/connect.yml:/app/connect.yml:rw
    depends_on:
      - mockup
  robot_ctrl:
    container_name: robot_ctrl
    build: 
      context: .
      dockerfile: DTsolution/scripts/Dockerfile
    volumes:
      - ./communication/connect.yml:/app/connect.yml:rw
    depends_on:
      - mockup
  godot:
    container_name: godot
    build: 
      context: .
      dockerfile: ${DOCKERFILE2:-DTsolution/DTservices/GODOT_Visualization_service/ur-3e-visualization/Dockerfile.x86}
    volumes:
      - ./communication/connect.yml:/app/connect.yml:rw
    ports:
      - "6080:6080"
    depends_on:
      - mockup
  inv_kinematics:
    container_name: inv_kinematics
    build:
      context: .
      dockerfile: DTsolution/DTservices/inv_kinematics/Dockerfile
    volumes:
      - ./communication/connect.yml:/app/connect.yml:rw
    depends_on:
      - stuck_joint

