x-base-build: &base-build
  context: ../../../
  dockerfile: Dockerfile.base
  target: service

services:
  influxdb:
    container_name: influxdb-server
    image: influxdb:latest
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ur3e
      DOCKER_INFLUXDB_INIT_PASSWORD: ur3eur3e
      DOCKER_INFLUXDB_INIT_ORG: ur3e
      DOCKER_INFLUXDB_INIT_BUCKET: ur3e
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: SECRET_AF
    volumes:
      - db-data:/var/lib/influxdb2:rw
    ports:
      - 8086:8086

  rabbitmq:
    container_name: rabbitmq-server
    image: rabbitmq:3.12-management
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ur3e
      RABBITMQ_DEFAULT_PASS: ur3e
    ports:
      - 5672:5672
      - 15672:15672
      - 1883:1883
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_mqtt rabbitmq_federation_management rabbitmq_stomp &&
            docker-entrypoint.sh rabbitmq-server"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  mockup:
    container_name: ur3e_mockup
    build:
      context: ../../../ur3e_mockup
      dockerfile: ${DOCKERFILE:-Dockerfile.x86}
    volumes:
      - ../../../startup/startup.conf:/app/startup.conf:z
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy

  data_recorder:
    container_name: data_recorder
    build: 
      <<: *base-build
    volumes:
      - ../../../communication/connect.yml:/app/connect.yml:rw
      - ../../../DTsolution/DTservices/data_recorder/influxdb.yml:/app/influxdb.yml:rw
      - ../../../DTsolution/DTservices/data_recorder/data_recorder.py:/app/data_recorder.py
    command: python -u data_recorder.py
    depends_on:
      rabbitmq:
        condition: service_healthy
      influxdb:
        condition: service_started
      mockup:
        condition: service_started

  robot_ctrl:
    container_name: robot_ctrl
    build:
      <<: *base-build
    volumes:
      - ../../../communication/connect.yml:/app/connect.yml:rw
      - ../../../DTsolution/scripts/robot_ctrl.py:/app/robot_ctrl.py
    command: python -u robot_ctrl.py
    depends_on:
      rabbitmq:
        condition: service_healthy
      mockup:
        condition: service_started
      

volumes:
  db-data: